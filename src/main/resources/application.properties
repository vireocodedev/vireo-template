spring.application.name=starter-template
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
vireo.starter.auth.docs-role=SUPERADMIN
server.forward-headers-strategy=native
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false
vireo.starter.offline.heartbeat-interval=5s
vireo.starter.offline.max-batch-size=50
vireo.starter.offline.max-replay-attempts=5
vireo.starter.offline.command-retention=P30D
vireo.starter.offline.max-commands-per-partition=10000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
